#   make patches
patch-make
    npm shrinkwrap && \
    patch-package --patch-dir package.d && \
    shx rm -f npm-shrinkwrap.json

#   (internal) apply patches
patch-apply
    patch-package --patch-dir package.d

#   static code analysis (linting)
lint
    tsc --project etc/tsc.json --noEmit && \
    eslint --config etc/eslint.mts src/*.ts sample/*.ts && \
    npx knip -n -c etc/knip.jsonc

#   code compilation/transpiling (building)
build : lint
    VITE_BUILD_FORMATS=es,cjs vite --config etc/vite.mts build --mode production
    VITE_BUILD_FORMATS=umd    vite --config etc/vite.mts build --mode production

#   code compilation/transpiling (building, development)
build-dev : lint
    VITE_BUILD_FORMATS=es,cjs vite --config etc/vite.mts build --mode development
    VITE_BUILD_FORMATS=umd    vite --config etc/vite.mts build --mode development

#   documentation compilation
build-doc
    node etc/d2.mts etc/d2.theme.d2 doc/mqtt-plus-comm-event-emission.d2 doc/mqtt-plus-comm-event-emission.svg
    node etc/d2.mts etc/d2.theme.d2 doc/mqtt-plus-comm-service-call.d2   doc/mqtt-plus-comm-service-call.svg
    node etc/d2.mts etc/d2.theme.d2 doc/mqtt-plus-comm-sink-push.d2      doc/mqtt-plus-comm-sink-push.svg
    node etc/d2.mts etc/d2.theme.d2 doc/mqtt-plus-comm-source-fetch.d2   doc/mqtt-plus-comm-source-fetch.svg
    node etc/d2.mts etc/d2.theme.d2 doc/mqtt-plus-architecture.d2        doc/mqtt-plus-architecture.svg

#   development loop
dev
    chokidar \
        "etc/*" "src/*" "tst/*" \
        -c "npm start build" \
        --debounce 1000 --throttle 1000 \
        --initial --verbose

#   run test suite
test
    tsc --project tst/tsc.std.json --noEmit && \
    eslint --config etc/eslint.mts tst/mqtt-plus-0-*.ts tst/*.spec.ts && \
    if [ ".$MQTT_BROKER" = . ]; then if [ ".`which docker 2>&1`" != . ]; then MQTT_BROKER=mosquitto; fi; else MQTT_BROKER=aedes; fi && \
    MQTT_BROKER="$MQTT_BROKER" \
    TSX_TSCONFIG_PATH="tst/tsc.std.json" \
    NODE_OPTIONS="--import=tsx --trace-warnings -r source-map-support/register" \
    mocha --require tst/mqtt-plus-0-fixture.ts tst/*.spec.ts

#   run test suite (with code coverage)
test-cov
    tsc --project tst/tsc.cov.json --noEmit && \
    eslint --config etc/eslint.mts tst/mqtt-plus-0-*.ts tst/*.spec.ts && \
    if [ ".$MQTT_BROKER" = . ]; then if [ ".`which docker 2>&1`" != . ]; then MQTT_BROKER=mosquitto; fi; else MQTT_BROKER=aedes; fi && \
    MQTT_BROKER="$MQTT_BROKER" \
    TSX_TSCONFIG_PATH="tst/tsc.cov.json" \
    NODE_OPTIONS="--import=tsx --trace-warnings -r source-map-support/register" \
    c8 --config etc/c8.json \
    mocha --require tst/mqtt-plus-0-fixture.ts tst/*.spec.ts

#   execute simple sample for testing
sample
    npx tsx sample/sample.ts

#   publish to github.com and npmjs.com
publish [hostname=en4.*]
    increment="patch"; \
    case "$*" in -i* ) increment=`echo "$*" | sed -e 's;^-i;;'` ;; esac; \
    kickout "$increment" && \
    VERSION=`sed -n '/"version":/ s/.*: *"\(.*\)".*/\1/p' package.json` && \
    V=`echo "$VERSION" | sed -e 's;\.;\\.;g'` && \
    sed -n -e "/^${V} /, /^[0-9]\\./ { /^${V} /p; /^[0-9]\\./!p; }" <CHANGELOG.md >.notes.md && \
    gh release create --title "MQTT+ $VERSION" --notes-file .notes.md --verify-tag $VERSION && \
    rm -f .notes.md

#   cleanup (built artifacts)
clean
    shx rm -rf dst-stage1 dst-stage2

#   cleanup (bootstrap artifacts)
distclean : clean
    shx rm -f package-lock.json
    shx rm -rf node_modules

